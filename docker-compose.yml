# HWSW Monitor - nasazeni na QNAP (Container Station) nebo jakykoli Docker.
services:
  hwsw:
    image: hwsw-monitor:1.2.0
    build: .
    container_name: hwsw-monitor
    restart: unless-stopped
    ports:
      - "8580:8580"          # QNAP sam pouziva 8080/443, proto 8580
    environment:
      TZ: Europe/Prague
      # Heslo uctu "admin" pri uplne prvnim startu (jinak "admin"; zmena je pri prihlaseni povinna).
      # HWSW_ADMIN_PASSWORD: "zmente-me"
      # Aplikace bezi na HTTPS s vlastnim certifikatem (vznikne pri prvnim startu v ./data/tls).
      # Jmena a adresy, pod kterymi ji budete otevirat - zapisou se do certifikatu pri jeho vytvoreni:
      # HWSW_TLS_NAMES: "nas.firma.local,192.168.1.10"
      # Za reverzni proxy, ktera sifruje sama, lze vlastni HTTPS vypnout:
      # HWSW_TLS: "off"
    volumes:
      - ./data:/data          # databaze + zalohy + sifrovaci klic + certifikat; prezije jakoukoli aktualizaci image

    # Varianta s primym pristupem do site (presnejsi zjisteni MAC adres pri skenu):
    # zakomentujte "ports:" vyse a odkomentujte nasledujici radek.
    # network_mode: host
